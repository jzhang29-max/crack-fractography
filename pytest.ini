# Pytest's entry point for this repository.
#
# WHY THIS FILE EXISTS. A bare `pytest` from the repo root used to abort before running a
# single test:
#
#   ERROR collecting analysis/research/improve/texture_channel_test.py
#     ModuleNotFoundError: No module named 'pandas'
#   ERROR collecting data/sem/interior_active_learning/code/test_app.py
#     ModuleNotFoundError: No module named 'joblib'
#   !!! Interrupted: 2 errors during collection !!!
#
# Neither file is part of this project's suite. The first is a research script that
# happens to end in _test.py and imports the SEM repo's detect_cracks, which wants an
# interpreter this app's venv deliberately is not. The second belongs to the archived
# sem-crack-detector and is only reachable because data/sem is a symlink into it -- pytest
# follows symlinked directories, so a vendored tree collects as if it were ours. CI passes
# `tests/` explicitly and so never saw either one: the failure was reserved for whoever
# typed the obvious command, and it reads exactly like a broken build.
#
# WHY pytest.ini AND NOT pyproject.toml. This repo has no Python packaging metadata at all
# -- no pyproject.toml, setup.py, setup.cfg or tox.ini. Dependencies are requirements.txt
# and the deliverable is a PyInstaller bundle, not a distribution. Adding a pyproject.toml
# to hold four lines of pytest settings would plant a file that readers and tools take as
# a package definition. pytest.ini configures pytest and nothing else, and it outranks
# every other pytest config source, so nothing added later can quietly shadow it.
#
# WHAT THIS CANNOT DO. testpaths supplies the default ONLY when no path is given on the
# command line. CI's `pytest -q tests/ -rs`, the bundle guards' `python -m pytest -q
# tests/test_packaging.py`, packaging/build.sh's `-m pytest -q tests/` and any
# `pytest tests/test_x.py::test_y` all pass a path, so this file can neither narrow nor
# widen what any of them collect.

[pytest]
testpaths = tests

# The stock list, plus the two trees that are not ours to collect from: data/ is vendored
# (symlinks into the archived sibling repos) and analysis/ holds research scripts and the
# dev output directory, not the suite. The defaults are repeated on purpose -- setting
# norecursedirs REPLACES them rather than extending them, and dropping `.*` would walk a
# `pytest .` straight into .git and .venv.
norecursedirs = data analysis .* *.egg _darcs build CVS dist node_modules venv {arch}
