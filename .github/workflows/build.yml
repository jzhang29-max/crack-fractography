name: build

# Builds the app on all three platforms. Only macOS is developed and tested by hand here,
# so the other two exist to answer one question honestly: does it package and start at all?
# A green run is not a claim that the app has been used on Windows or Linux.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: system deps for pywebview
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 \
            libcairo2-dev pkg-config python3-dev
      - run: pip install -r requirements.txt pytest
      # No SEM checkout on CI, so the tests that need one skip themselves. That is the
      # point: it proves the app's own code stands up without the sibling repo, which is
      # exactly the situation a downloaded copy is in.
      - run: pytest -q tests/ -rs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r packaging/requirements-build.txt pytest

      # RE-VENDOR ON THE PATH THAT BUILDS WHAT PEOPLE DOWNLOAD. This job ran pyinstaller
      # directly -- no vendor.py, no pytest -- and the `test` job cannot cover the drift
      # check either, because it runs on a fresh checkout with no SEM repo and skips
      # itself.
      #
      # --if-available, and NOT because the flag is tidier: plain `vendor.py` exits 1 when
      # no SEM repo is present, which is correct for a person who asked to re-vendor and
      # wrong for a runner that has none on purpose. Added without it, this step failed all
      # three builds on the assumption that it would no-op -- an assumption I wrote into
      # the comment instead of checking.
      #
      # AND IT IS HONEST ABOUT WHAT CI PROVES: with no SEM checkout, nothing here can
      # detect that the vendored copy is stale, because that copy is the only
      # implementation present. The drift guarantee is local, made by packaging/build.sh on
      # a machine that has both repos. What this buys is that a runner which CAN reach a
      # repo re-vendors, and that the bundle guards below run against the bundle just built.
      - run: python packaging/vendor.py --if-available
      - run: pyinstaller --noconfirm --clean packaging/fractography.spec

      # THE BUNDLE'S OWN GUARDS, against the bundle that was just built -- the same order
      # build.sh uses locally, and for the reason this repo learnt once already: an icon
      # test run BEFORE the rebuild asserted on the previous bundle and deadlocked the
      # build it was meant to protect.
      - name: bundle guards
        run: python -m pytest -q tests/test_packaging.py

      # Does it START and SERVE? A build that produces a binary which cannot answer a
      # request is a green check on nothing -- this project has shipped that before.
      # Does it START and SERVE? A build that produces a binary which cannot answer a
      # request is a green check on nothing -- this project has shipped that before.
      - name: smoke test
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   BIN="dist/Crack Fractography.app/Contents/MacOS/Crack Fractography" ;;
            Windows) BIN="dist/Crack Fractography/Crack Fractography.exe" ;;
            *)       BIN="dist/Crack Fractography/Crack Fractography" ;;
          esac
          python packaging/smoke_check.py "$BIN" 8899

      # ---------------------------------------------------------------------------
      # PACKAGE IT INTO THE THING THAT PLATFORM'S USERS ACTUALLY DOWNLOAD.
      # dist/ was uploaded raw as a CI artifact: a folder, 14-day retention, and only
      # reachable by someone logged into GitHub who knows to look at a workflow run. That
      # is not a download. Each platform gets its conventional single file, and the
      # release job below attaches all three to the tag.
      - name: name the version
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) V="0.0.0-$(git rev-parse --short HEAD)";; esac
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: package (macOS .dmg)
        if: runner.os == 'macOS'
        run: bash packaging/make_dmg.sh "dist/Crack Fractography.app" "${{ steps.ver.outputs.v }}"

      - name: package (Windows .zip)
        if: runner.os == 'Windows'
        shell: bash
        # packaging/make_zip.py, not a shell tool. Two have been tried and each failed
        # differently on this runner and nowhere else:
        #   Compress-Archive wrote an archive Expand-Archive could not restore -- dist/
        #   started and served, the unpacked copy died with RecursionError.
        #   bsdtar was correct and evidently stored rather than deflated: the published
        #   zip went 71 MB -> 160 MB on the switch, while the same command on macOS
        #   compresses 4,640 KB of JavaScript to 1,596 KB.
        # Python's zipfile is installed wherever this runs, takes the compression as an
        # argument rather than a default, and refuses to emit a stored archive.
        run: |
          v="${{ steps.ver.outputs.v }}"
          python packaging/make_zip.py write "dist/Crack Fractography" \
            "dist/CrackFractography-$v-Windows-x64.zip" "Crack Fractography"

      - name: package (Linux .tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        # tar.gz rather than AppImage: appimagetool needs FUSE on the runner, and a
        # packaging step that can fail for reasons unrelated to the app is worse than a
        # format every Linux user can already open.
        run: |
          v="${{ steps.ver.outputs.v }}"
          tar -C dist -czf "dist/CrackFractography-$v-Linux-x86_64.tar.gz" "Crack Fractography"

      # THE PACKAGE MUST ALSO START. Packaging can produce a file that unpacks to a broken
      # tree -- a missing symlink, a dropped permission bit -- and the smoke test above ran
      # on dist/, not on this. So it is unpacked to a fresh location and run from there,
      # which is what a downloader does.
      - name: the packaged copy starts
        shell: bash
        run: |
          set -e
          v="${{ steps.ver.outputs.v }}"
          rm -rf _unpack && mkdir _unpack
          case "${{ runner.os }}" in
            macOS)
              hdiutil attach "dist/CrackFractography-$v-macOS-arm64.dmg" -nobrowse -quiet -mountpoint _mnt
              cp -R "_mnt/Crack Fractography.app" _unpack/
              hdiutil detach _mnt -quiet
              BIN="_unpack/Crack Fractography.app/Contents/MacOS/Crack Fractography" ;;
            Windows)
              # The same helper that wrote it, for the same reason.
              python packaging/make_zip.py read \
                "dist/CrackFractography-$v-Windows-x64.zip" _unpack
              BIN="_unpack/Crack Fractography/Crack Fractography.exe" ;;
            *)
              tar -xzf "dist/CrackFractography-$v-Linux-x86_64.tar.gz" -C _unpack
              BIN="_unpack/Crack Fractography/Crack Fractography" ;;
          esac
          python packaging/smoke_check.py "$BIN" 8898

      # THE INTERFACE, ON THE PLATFORM THAT BUILT IT. Everything above proves the server
      # starts and measures; nothing had ever RENDERED the app anywhere but my own macOS
      # laptop. Asked "does Linux work?", the accurate answer was "the engine does, the UI
      # is unverified there" -- which is not an answer about the thing people download.
      #
      # Drives the packaged binary with headless chromium: tabs switch, the frame list
      # fills, a measurement and a figure render, the mask decodes, the limits drawer
      # opens, a drawing surface appears, and no page error is thrown. Structure and
      # behaviour, not pixels -- a screenshot diff would fail on font rendering between
      # platforms, which is the one difference that does not matter.
      - name: install a headless browser
        run: pip install playwright && python -m playwright install --with-deps chromium

      # ui_check.py STARTS THE APP ITSELF, the way smoke_check.py does. Backgrounding the
      # binary from bash worked on macOS and Linux and hung on Windows -- the step spent
      # its whole timeout on the first request and the server never answered, while
      # smoke_check launches the same exe on the same runner without trouble. One launcher,
      # already proven on three platforms, instead of a shell idiom that is only proven on
      # two.
      - name: the UI works on this platform
        shell: bash
        env:
          FRACTOGRAPHY_DATA: ${{ github.workspace }}/_ui_data
        run: |
          set -e
          case "${{ runner.os }}" in
            macOS)   BIN="dist/Crack Fractography.app/Contents/MacOS/Crack Fractography" ;;
            Windows) BIN="dist/Crack Fractography/Crack Fractography.exe" ;;
            *)       BIN="dist/Crack Fractography/Crack Fractography" ;;
          esac
          python packaging/ui_check.py "$BIN" 8897

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-${{ matrix.os }}
          path: |
            ui_check.png
            _ui_server.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # One release carrying all three downloads, built from the tag that triggered it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: pkg
      - name: what was built
        run: ls -lh pkg
      - name: all three platforms are present
        # A release missing a platform should fail loudly rather than ship two of three.
        run: |
          for ext in dmg zip tar.gz; do
            ls pkg/*."$ext" >/dev/null 2>&1 || { echo "no .$ext in the release"; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: pkg/*
          fail_on_unmatched_files: true
